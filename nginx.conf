server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve URL-encoded filenames (= and & in names) correctly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache HTML for easy editing
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|avif)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}
